# CI runs the same mise tasks as local development (`mise run check`);
# tool versions come from mise.toml via jdx/mise-action.
# https://mise.jdx.dev/continuous-integration.html

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Node.js 24 becomes the Actions default on 2026-06-16; opt in now so
  # jdx/mise-action is verified against it before the forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: mise run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          version: 2026.6.1

      - name: mise run check
        run: mise run check

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          version: 2026.6.1

      - name: mise run test-race
        run: mise run test-race
